appId: com.jsonlens.app
productName: JSONLens
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack: []
fileAssociations:
  - ext: json
    name: JSON Document
    role: Viewer
    mimeType: application/json
  - ext: ndjson
    name: NDJSON Document
    role: Viewer
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
